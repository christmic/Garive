[package]
name = "garive-creativity-baseline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "garive-fixture-creativity-generator"
path = "src/fixture_generator.rs"

[[bin]]
name = "garive-fixture-creativity-evaluator"
path = "src/fixture_evaluator.rs"

[[bin]]
name = "garive-creativity-publication"
path = "src/bin/creativity_publication.rs"

[dependencies]
garive-eval = { path = "../../engine/eval" }
garive-experiment-evidence = { path = "../evidence-support-rs" }
garive-llm = { path = "../../engine/llm" }
garive-openai-responses = { package = "garive-adapter-openai-responses", path = "../../adapters/openai-responses" }
garive-anthropic-messages = { package = "garive-adapter-anthropic-messages", path = "../../adapters/anthropic-messages" }
garive-provider-compatible = { path = "../../providers/compatible" }
garive-provider-profile = { path = "../../providers/profile" }
garive-runtime = { path = "../../runtime/replica" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
