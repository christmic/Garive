[package]
name = "garive-context-pressure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "garive-fixture-token-counter"
path = "src/fixture_counter.rs"

[dependencies]
garive-core = { path = "../../engine/core" }
garive-eval = { path = "../../engine/eval" }
garive-experiment-evidence = { path = "../evidence-support-rs" }
garive-llm = { path = "../../engine/llm" }
garive-provider-anthropic = { path = "../../providers/anthropic" }
garive-provider-compatible = { path = "../../providers/compatible" }
garive-provider-profile = { path = "../../providers/profile" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true

[dev-dependencies]
garive-adapter-anthropic-messages = { path = "../../adapters/anthropic-messages" }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
