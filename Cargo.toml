[workspace]
resolver = "2"
# Members are admitted as target skeletons; behavior lands in vertical slices.
# Planned members (per AGENTS.md architecture):
#
#   engine/{core,llm,tools}     # Agent kernel and model/tool contracts
#   runtime/replica
#   cli, tui
#   desktop/                  # Tauri Rust backend
#
# Active members (scaffolded):
#   bench                     # SWE-bench verification runtime
#
# NOT in this workspace (different language / different repo role):
#   runtime/gateway           — Go (independent go.mod)
#   desktop/frontend          — TS/React (independent pnpm)
#   mobile                    — Kotlin KMP (independent Gradle)
#   experiments/engine-kt      — optional Kotlin experiment (independent Gradle)
#   spec/proto                — schema source, not a member
members = [
    "bench",
    "engine/config",
    "engine/core",
    "engine/creativity",
    "engine/eval",
    "engine/knowledge",
    "engine/ledger",
    "engine/llm",
    "engine/memory",
    "engine/multiagent",
    "engine/observability",
    "engine/proto",
    "engine/scheduler",
    "engine/skill",
    "engine/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
