[workspace]
resolver = "2"
# Members are admitted as target skeletons; behavior lands in vertical slices.
# Active skeleton members:
#
#   engine/*                  # owned Agent capability crates
#   bench                     # benchmark scaffold
# Planned Rust members:
#   runtime/replica
#   cli, tui
#   desktop/                  # Tauri Rust backend
#
# NOT in this workspace (different language / different repo role):
#   runtime/gateway           — Go (independent go.mod)
#   desktop/frontend          — TS/React (independent pnpm)
#   mobile                    — Kotlin KMP (independent Gradle)
#   runtime/server-kt          — Kotlin Agent server (independent Gradle)
#   spec/proto                — schema source, not a member
members = [
    "bench",
    "cli",
    "engine/config",
    "engine/core",
    "engine/creativity",
    "engine/eval",
    "engine/knowledge",
    "engine/ledger",
    "engine/llm",
    "engine/memory",
    "engine/multiagent",
    "engine/observability",
    "engine/proto",
    "engine/scheduler",
    "engine/skill",
    "engine/tools",
    "runtime/replica",
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
futures = "0.3"
serde_json = "1.0"
sha2 = "0.10"
