[workspace]
resolver = "2"
# Active Rust members include the portable Engine, protocol adapters, SQLite
# Runtime, CLI/TUI shells, Tauri backend and benchmark scaffold.
#
# NOT in this workspace (different language / different repo role):
#   runtime/gateway           — Go (independent go.mod)
#   desktop/frontend          — TS/React (independent pnpm)
#   mobile                    — Kotlin KMP (independent Gradle)
#   experiments/engine-kt     — experimental Kotlin Engine (independent Gradle)
#   spec/proto                — schema source, not a member
members = [
    "adapters/openai-responses",
    "adapters/anthropic-messages",
    "bench",
    "cli",
    "desktop/backend",
    "engine/config",
    "engine/core",
    "engine/creativity",
    "engine/eval",
    "engine/knowledge",
    "engine/ledger",
    "engine/llm",
    "engine/memory",
    "engine/multiagent",
    "engine/observability",
    "engine/proto",
    "engine/scheduler",
    "engine/skill",
    "engine/tools",
    "runtime/replica",
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures = "0.3"
http = "1.3"
httpdate = "1.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
prost = "0.14.4"
