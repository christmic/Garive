[workspace]
resolver = "2"
# Active Rust members include the portable Engine, protocol adapters/providers,
# SQLite Runtime, CLI/TUI shells, Tauri backend and benchmark scaffold.
#
# NOT in this workspace (different language / different repo role):
#   runtime/gateway           — Go (independent go.mod)
#   desktop/frontend          — TS/React (independent pnpm)
#   mobile                    — Kotlin KMP (independent Gradle)
#   experiments/engine-kt     — experimental Kotlin Engine (independent Gradle)
#   spec/proto                — schema source, not a member
members = [
    "adapters/openai-responses",
    "adapters/anthropic-messages",
    "bench",
    "clients/host-rs",
    "cli",
    "desktop/backend",
    "engine/config",
    "engine/core",
    "engine/creativity",
    "engine/eval",
    "engine/knowledge",
    "engine/ledger",
    "engine/llm",
    "engine/memory",
    "engine/multiagent",
    "engine/observability",
    "engine/proto",
    "engine/scheduler",
    "engine/skill",
    "engine/tools",
    "experiments/context-pressure-rs",
    "experiments/creativity-baseline-rs",
    "experiments/evidence-support-rs",
    "providers/compatible",
    "providers/profile",
    "providers/openai",
    "providers/anthropic",
    "runtime/replica",
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98.0"

[workspace.dependencies]
axum = "0.7.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3"
http = "1.3"
httpdate = "1.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2.0"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
prost = "0.14.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
