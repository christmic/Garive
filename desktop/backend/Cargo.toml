[package]
name = "garive-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono.workspace = true
garive-core = { path = "../../engine/core" }
garive-llm = { path = "../../engine/llm" }
garive-provider-anthropic = { path = "../../providers/anthropic" }
garive-provider-compatible = { path = "../../providers/compatible" }
garive-provider-openai = { path = "../../providers/openai" }
garive-provider-profile = { path = "../../providers/profile" }
garive-runtime = { path = "../../runtime/replica" }
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
tauri = { version = "2.11.5", features = [] }
tokio.workspace = true
url = "2.5.8"
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3.27.0"
