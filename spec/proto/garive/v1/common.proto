// Garive wire schema — single source of truth.
//
// Current consumer: experiments/engine-kt/proto via the Gradle protobuf
// plugin. Rust and mobile consumers land only with their implementation slice.
//
// DO NOT hand-edit generated code in either language. To change a
// wire shape, edit this file and run the consumer's pinned generator. The
// top-level `just codegen` recipe is not wired yet.

syntax = "proto3";

package garive.v1;

// Stable identity for an Agent instance.
message AgentIdentity {
    // Opaque, server-assigned Agent identity.
    string id = 1;
    // Human-readable Agent label.
    string name = 2;
    // Agent class such as "core" or "specialist".
    string kind = 3;
}

// Minimal liveness shape for the current Kotlin schema experiment. It becomes
// a cross-language contract only when another real consumer lands.
message PingRequest {
    // Caller identity or component label.
    string from = 1;
    // Caller timestamp in Unix epoch milliseconds.
    int64  ts_ms = 2;
}

// Minimal liveness response for the current schema experiment.
message PingResponse {
    // Liveness response text.
    string pong = 1;
    // Responder timestamp in Unix epoch milliseconds.
    int64  ts_ms = 2;
}
