syntax = "proto3";

package com.garive.host.v1;

// Stable Host API v1 wire values. Event remains a string so unknown future
// facts survive decoding and can be classified without enum-value loss.
message HostEventV1 {
  // Exact Host API version used to encode the event.
  string api_version = 1;
  // Session owning this event stream.
  string session_id = 2;
  // Source Session fact position. Live projections may contain gaps.
  uint64 position = 3;
  // Stable semantic event name; unknown names remain decodable.
  string event = 4;
  // Owning Turn identity when the event is turn-scoped.
  string turn_id = 5;
  // Owning disposable Execution identity when applicable.
  string execution_id = 6;
  // Optional text carried by output events.
  string text = 7;
  // Committed redacted Agent activity state when this is an H3 event.
  HostActivityV1 activity = 8;
}

// One bounded redacted state in a committed Agent activity lifecycle.
message HostActivityV1 {
  // Exact Host API version used to encode the activity.
  string api_version = 1;
  // Opaque activity identity scoped to its Session.
  string activity_id = 2;
  // Stable activity class; unknown future values remain decodable.
  string kind = 3;
  // Installed localization key; never a raw tool name.
  string label_key = 4;
  // Stable lifecycle state; unknown future values remain decodable.
  string state = 5;
  // Exact committed fact position producing this public state.
  uint64 source_position = 6;
  // Authoritative terminal marker for this public state.
  bool terminal = 7;
  // Optional admitted stable failure or decision code.
  optional string safe_code = 8;
}

// Creates one durable Session for an active registered Agent.
message CreateSessionRequestV1 {
  reserved 1;
  reserved "agent_definition_id";
  // Registered Agent selected by the caller.
  string agent_id = 2;
}

// Lifecycle of one registered Agent.
enum AgentStatusV1 {
  // Missing status is invalid on a materialized Agent.
  AGENT_STATUS_V1_UNSPECIFIED = 0;
  // Defined but unavailable for new work.
  AGENT_STATUS_V1_INACTIVE = 1;
  // Admitted for new Session membership and Runs.
  AGENT_STATUS_V1_ACTIVE = 2;
  // Administratively retired until reactivation.
  AGENT_STATUS_V1_ARCHIVED = 3;
}

// Public metadata for one directory-backed Agent.
message AgentV1 {
  // Exact Host API version.
  string api_version = 1;
  // Stable immutable Agent identity.
  string agent_id = 2;
  // Immutable resource root and ordinary workspace.
  string working_directory = 3;
  // Ordered read-only knowledge roots.
  repeated string readonly_knowledge_directories = 4;
  // Optional single read/write knowledge root.
  optional string writable_knowledge_directory = 5;
  // Current administrative lifecycle.
  AgentStatusV1 status = 6;
}

// Creates one inactive directory-backed Agent.
message CreateAgentRequestV1 {
  // Stable immutable Agent identity.
  string agent_id = 1;
  // Immutable resource root and ordinary workspace.
  string working_directory = 2;
  // Ordered read-only knowledge roots.
  repeated string readonly_knowledge_directories = 3;
  // Optional single read/write knowledge root.
  optional string writable_knowledge_directory = 4;
}

// Atomically replaces the mutable knowledge-directory binding.
message UpdateAgentKnowledgeRequestV1 {
  // Complete replacement ordered read-only roots.
  repeated string readonly_knowledge_directories = 1;
  // Complete replacement read/write root; absence clears it.
  optional string writable_knowledge_directory = 2;
}

// Stable bounded Agent registry page.
message AgentPageV1 {
  // Exact Host API version.
  string api_version = 1;
  // Agents in stable ascending identity order.
  repeated AgentV1 agents = 2;
}

// Durable result of Session creation or exact idempotent replay.
message CreateSessionResponseV1 {
  // Stable created Session identity.
  string session_id = 1;
  // Runtime-owned Agent instance bound to the Session.
  string agent_instance_id = 2;
  // Last durable position committed by this command.
  uint64 committed_position = 3;
}

// Starts one durable Turn in an existing Session.
message StartTurnRequestV1 {
  // Trusted user text admitted by the local Host.
  string text = 1;
}

// Requests cancellation of one Turn under its owning Session.
message CancelTurnRequestV1 {
  // Session expected to own the path Turn.
  string session_id = 1;
  // Fixed durable watermark observed by the caller.
  uint64 requested_through_position = 2;
}

// Continues one exactly suspended Turn.
message ContinueTurnRequestV1 {
  // Session expected to own the path Turn.
  string session_id = 1;
  // Exact current suspension identity.
  string suspension_id = 2;
  // Optimistic Session version observed with the suspension.
  uint64 expected_session_version = 3;
  // Trusted external input satisfying the suspension.
  string input = 4;
  // Exact RFC 8785 JSON text satisfying a typed interaction schema.
  optional string input_json = 5;
}

// Durable result of a Turn mutation or exact idempotent replay.
message TurnCommandResponseV1 {
  // Owning Session identity.
  string session_id = 1;
  // Stable durable Turn identity.
  string turn_id = 2;
  // Fresh disposable Execution identity when the command created one.
  string execution_id = 3;
  // Last durable position committed by this command.
  uint64 committed_position = 4;
}

// Stable redacted failure envelope returned by the Host.
message HostErrorV1 {
  // Machine-readable failure code frozen by the H1 contract.
  string code = 1;
  // Non-secret operator-safe summary.
  string message = 2;
}

// One installed immutable Agent definition available for new Sessions.
message AgentDefinitionSummaryV1 {
  // Exact Host API version used to encode this definition.
  string api_version = 1;
  // Stable installed immutable Agent definition identity.
  string definition_id = 2;
  // Installed immutable definition revision.
  string definition_revision = 3;
  // Sorted stable public capabilities available to new Sessions.
  repeated string capabilities = 4;
}

// Bounded ordered installed-Agent discovery result.
message AgentDefinitionPageV1 {
  // Exact Host API version used to encode this page.
  string api_version = 1;
  // Bounded ordered definitions visible to this Host.
  repeated AgentDefinitionSummaryV1 definitions = 2;
}

// Durable restart-safe Session navigation summary.
message SessionSummaryV1 {
  // Exact Host API version used to encode this summary.
  string api_version = 1;
  // Stable durable Session identity.
  string session_id = 2;
  // Runtime-owned Agent instance bound to the Session.
  string agent_instance_id = 3;
  // Immutable definition identity captured when the Session opened.
  string definition_id = 4;
  // Immutable definition revision captured when the Session opened.
  string definition_revision = 5;
  // Validated RFC 3339 timestamp of the Session open fact.
  string opened_at = 6;
  // Frozen last durable position observed for the Session.
  uint64 latest_position = 7;
  // Most recently started Turn identity when the Session has a Turn.
  optional string latest_turn_id = 8;
  // Public state of the most recently started Turn when present.
  optional string latest_turn_state = 9;
  // Count of verified first-start Turn facts in this Session.
  uint64 turn_count = 10;
  // Stable registered Agent identity bound to the founding member.
  string agent_id = 11;
}

// Reverse-opened bounded Session navigation page.
message SessionPageV1 {
  // Exact Host API version used to encode this page.
  string api_version = 1;
  // Reverse-opened bounded Session summaries.
  repeated SessionSummaryV1 sessions = 2;
  // Opaque cursor for the next older page when one exists.
  optional string next_before = 3;
}

// One exact Session summary frozen at an observed Ledger watermark.
message SessionViewV1 {
  // Exact Host API version used to encode this view.
  string api_version = 1;
  // Exact requested durable Session summary.
  SessionSummaryV1 session = 2;
  // Frozen maximum durable position used for this projection.
  uint64 observed_max_position = 3;
}

// One bounded and redacted durable Goal projection.
message GoalSummaryV1 {
  // Exact Host API version used to encode this Goal.
  string api_version = 1;
  // Stable Goal identity.
  string goal_id = 2;
  // Current contiguous Goal revision.
  uint64 revision = 3;
  // Stable public lifecycle state.
  string state = 4;
  // Current definition digest without private definition fields.
  string definition_digest = 5;
  // Bounded objective display text.
  string objective = 6;
  // Whether objective display text was truncated.
  bool objective_truncated = 7;
  // Public parent Goal identity when present.
  optional string parent_goal_id = 8;
  // Number of attempts started from Draft.
  uint32 attempt_number = 9;
  // Number of declared success criteria.
  uint32 criteria_total = 10;
  // Number of verified terminal success criteria.
  uint32 criteria_satisfied = 11;
}

// Complete bounded Goal page at one Session watermark.
message GoalPageV1 {
  // Exact Host API version used to encode this page.
  string api_version = 1;
  // Session owning every Goal.
  string session_id = 2;
  // Goals in stable identity order.
  repeated GoalSummaryV1 goals = 3;
  // Session version used for optimistic commands.
  uint64 session_version = 4;
  // Frozen maximum durable position used by this projection.
  uint64 observed_max_position = 5;
}

// Authority-admitted canonical Goal creation proposal.
message CreateGoalRequestV1 {
  // Exact Session version against which creation must commit.
  uint64 expected_session_version = 1;
  // Canonical authority-admitted GoalDefinitionV1 JSON.
  string definition_json = 2;
}

// Durable public receipt for one Goal mutation.
message GoalCommandResponseV1 {
  // Exact Host API version used to encode this receipt.
  string api_version = 1;
  // Session owning the mutated Goal.
  string session_id = 2;
  // Stable Goal identity.
  string goal_id = 3;
  // Durable Goal lifecycle revision after the mutation.
  uint64 revision = 4;
  // Stable Goal lifecycle state code.
  string state = 5;
  // Session version committed by the mutation.
  uint64 session_version = 6;
  // Highest durable position committed by the mutation.
  uint64 committed_position = 7;
}

// Exact authority-admitted Goal cancellation proposal.
message CancelGoalRequestV1 {
  // Session owning the Goal.
  string session_id = 1;
  // Exact Session version against which cancellation must commit.
  uint64 expected_session_version = 2;
  // Exact Goal revision authorized for cancellation.
  uint64 expected_revision = 3;
  // Stable authority-admitted cancellation reason code.
  string reason = 4;
}

// Exact authority-admitted Goal definition replacement.
message ReviseGoalRequestV1 {
  // Session owning the Goal.
  string session_id = 1;
  // Exact Session version against which revision must commit.
  uint64 expected_session_version = 2;
  // Exact Goal revision being replaced.
  uint64 expected_revision = 3;
  // Canonical authority-admitted replacement GoalDefinitionV1 JSON.
  string definition_json = 4;
  // Stable authority-admitted replacement reason code.
  string replacement_reason = 5;
}

// One bounded redacted durable Plan revision projection.
message PlanSummaryV1 {
  // Exact Host API version used to encode this summary.
  string api_version = 1;
  // Stable Plan lineage identity.
  string plan_id = 2;
  // Immutable Plan definition revision.
  uint64 revision = 3;
  // Stable Plan lifecycle state code.
  string state = 4;
  // Canonical immutable Plan definition digest.
  string definition_digest = 5;
  // Goal identity bound by this Plan revision.
  string goal_id = 6;
  // Goal lifecycle anchor observed by this Plan revision.
  uint64 goal_revision = 7;
  // Contiguous mutable state version within this Plan revision.
  uint64 state_version = 8;
  // Total number of declared Steps.
  uint32 steps_total = 9;
  // Number of Steps currently ready for claim.
  uint32 steps_ready = 10;
  // Number of currently claimed, running or suspended Steps.
  uint32 steps_active = 11;
  // Number of durably completed Steps.
  uint32 steps_completed = 12;
  // Number of durably failed Steps.
  uint32 steps_failed = 13;
  // Total attempts consumed by this Plan revision.
  uint32 total_attempts = 14;
}

// Complete bounded Plan revision page at one Session watermark.
message PlanPageV1 {
  // Exact Host API version used to encode this page.
  string api_version = 1;
  // Session owning every projected Plan revision.
  string session_id = 2;
  // Plan revisions in stable lineage/revision order.
  repeated PlanSummaryV1 plans = 3;
  // Session version used for optimistic commands.
  uint64 session_version = 4;
  // Frozen maximum durable position used by this projection.
  uint64 observed_max_position = 5;
}

// Restart-safe public continuation coordinates and redacted prompt.
message SuspensionViewV1 {
  // Exact current durable suspension identity.
  string suspension_id = 1;
  // Optimistic Session version required for continuation.
  uint64 session_version = 2;
  // Stable public suspension kind.
  string kind = 3;
  // Stable schema identity for the redacted public prompt.
  string prompt_schema = 4;
  // Canonical RFC 8785 UTF-8 public prompt JSON.
  bytes prompt_json = 5;
  // Lowercase SHA-256 of prompt_json.
  string prompt_digest = 6;
  // Canonical portable response schema when continuation is supported.
  optional bytes response_schema_json = 7;
  // Lowercase SHA-256 of response_schema_json when present.
  optional string response_schema_digest = 8;
}

// One complete durable Turn projection; continuations update this item.
message TurnTimelineItemV1 {
  // Stable durable Turn identity.
  string turn_id = 1;
  // Position of the verified first-start fact.
  uint64 started_position = 2;
  // Frozen latest position that changed this Turn.
  uint64 latest_position = 3;
  // Stable public lifecycle state.
  string state = 4;
  // Trusted user text bound to the first start.
  string user_text = 5;
  // Redacted committed response projection when completed.
  optional string completion_text = 6;
  // Restart-safe continuation coordinates when suspended.
  SuspensionViewV1 suspension = 7;
  // Whether bounded user or completion display content was truncated.
  bool content_truncated = 8;
  // Latest committed public state of each activity owned by this Turn.
  repeated HostActivityV1 activities = 9;
}

// Ascending bounded complete-Turn projection page.
message TurnTimelinePageV1 {
  // Exact Host API version used to encode this page.
  string api_version = 1;
  // Session owning every returned Turn.
  string session_id = 2;
  // Ascending complete Turn projections.
  repeated TurnTimelineItemV1 items = 3;
  // Durable scan cursor to use as the next after_position.
  uint64 scanned_through_position = 4;
  // Frozen maximum durable position used for this projection.
  uint64 observed_max_position = 5;
  // Whether another bounded timeline page remains.
  bool has_more = 6;
}
