syntax = "proto3";

package com.garive.host.v1;

// Stable Host API v1 wire values. Event remains a string so unknown future
// facts survive decoding and can be classified without enum-value loss.
message HostEventV1 {
  string api_version = 1;
  string session_id = 2;
  uint64 position = 3;
  string event = 4;
  string turn_id = 5;
  string execution_id = 6;
  string text = 7;
}

message FakeHostCommandV1 {
  string agent_definition_id = 1;
  string text = 2;
}

message FakeHostScenarioV1 {
  string api_version = 1;
  FakeHostCommandV1 command = 2;
  repeated HostEventV1 events = 3;
}
